{% extends 'base.html' %}

{% block title %}Profile - Interview Review{% endblock %}

{% block content %}
<div class="profile-container">
    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar">
                <span>{{ user.username|first|upper }}</span>
            </div>
            <div>
                <h2>{{ user.username }}</h2>
                <p class="member-since">Member since {{ user.date_joined|date:"F Y" }}</p>
            </div>
        </div>

        <form method="post" id="profileForm">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" name="username" value="{{ user.username }}" disabled>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" disabled>
                </div>
            </div>

            <div class="form-group" id="passwordField" style="display: none;">
                <label><i class="fas fa-lock"></i> New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter new password">
            </div>

            <div class="button-row">
                <button type="button" id="editBtn" class="edit-btn"><i class="fas fa-pen"></i> Edit Profile</button>
                <button type="submit" id="saveBtn" class="save-btn" style="display: none;"><i class="fas fa-check"></i> Save</button>
                <button type="button" id="cancelBtn" class="cancel-btn" style="display: none;"><i class="fas fa-times"></i> Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    const editBtn = document.getElementById('editBtn');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const passwordField = document.getElementById('passwordField');
    const inputs = document.querySelectorAll('#profileForm input');

    editBtn.addEventListener('click', () => {
        inputs.forEach(i => i.disabled = false);
        passwordField.style.display = 'block';
        editBtn.style.display = 'none';
        saveBtn.style.display = 'inline-flex';
        cancelBtn.style.display = 'inline-flex';
    });

    cancelBtn.addEventListener('click', () => {
        inputs.forEach(i => i.disabled = true);
        passwordField.style.display = 'none';
        editBtn.style.display = 'inline-flex';
        saveBtn.style.display = 'none';
        cancelBtn.style.display = 'none';
    });
</script>

<style>
.profile-container {
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

.profile-card {
    background: linear-gradient(145deg, #0b1b2b, #162d4a);
    color: #fff;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    width: 100%;
    max-width: 600px;
    animation: scaleIn 0.4s ease-out;
}

@keyframes scaleIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 35px;
    padding-bottom: 25px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.profile-header h2 {
    font-weight: 700;
    color: #fff;
    margin: 0;
    font-size: 1.4rem;
}

.member-since {
    color: #636e82;
    font-size: 0.85rem;
    margin-top: 4px;
}

.avatar {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
    color: #fff;
    font-size: 1.5rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(116,185,255,0.3);
    flex-shrink: 0;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 5px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #8a9bb5;
    font-weight: 600;
    font-size: 0.88rem;
}

.form-group input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: #e0e6ed;
    outline: none;
    transition: all 0.3s ease;
    font-family: inherit;
    font-size: 0.95rem;
}

.form-group input:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.form-group input:focus:not(:disabled) {
    border-color: #74b9ff;
    box-shadow: 0 0 0 4px rgba(116,185,255,0.1);
    background: rgba(116,185,255,0.06);
}

.button-row {
    margin-top: 25px;
    display: flex;
    gap: 12px;
}

.edit-btn, .save-btn, .cancel-btn {
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.25s ease;
    font-family: inherit;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.edit-btn {
    background: rgba(116,185,255,0.15);
    color: #74b9ff;
    border: 1.5px solid rgba(116,185,255,0.3);
}

.save-btn {
    background: rgba(0,184,148,0.15);
    color: #00b894;
    border: 1.5px solid rgba(0,184,148,0.3);
}

.cancel-btn {
    background: rgba(225,112,85,0.15);
    color: #e17055;
    border: 1.5px solid rgba(225,112,85,0.3);
}

.edit-btn:hover { background: rgba(116,185,255,0.25); transform: translateY(-1px); }
.save-btn:hover { background: rgba(0,184,148,0.25); transform: translateY(-1px); }
.cancel-btn:hover { background: rgba(225,112,85,0.25); transform: translateY(-1px); }

@media (max-width: 768px) {
    .form-row { grid-template-columns: 1fr; }
    .profile-card { padding: 30px 25px; }
}
</style>
{% endblock %}
