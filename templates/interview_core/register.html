{% extends 'base.html' %}

{% block title %}Register - Interview Review{% endblock %}

{% block content %}
<style>
.register-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
}

.register-card {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 24px;
    padding: 45px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    animation: scaleIn 0.4s ease-out;
}

@keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.register-brand {
    text-align: center;
    margin-bottom: 10px;
}
.register-brand .icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: white;
    margin-bottom: 12px;
    box-shadow: 0 8px 25px rgba(0,184,148,0.3);
}
.register-brand h1 {
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
}
.register-brand h1 span { color: #00b894; }

.register-card h2 {
    text-align: center;
    color: #8a9bb5;
    margin-bottom: 30px;
    font-size: 1rem;
    font-weight: 500;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    color: #8a9bb5;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.88rem;
    letter-spacing: 0.3px;
}

.form-group input {
    width: 100%;
    padding: 14px 18px;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    font-size: 15px;
    background: rgba(255,255,255,0.04);
    color: #e0e6ed;
    transition: all 0.3s ease;
    box-sizing: border-box;
    font-family: inherit;
}

.form-group input:focus {
    outline: none;
    border-color: #00b894;
    background: rgba(0,184,148,0.06);
    box-shadow: 0 0 0 4px rgba(0,184,148,0.1);
}

.form-group input::placeholder { color: rgba(224,230,237,0.35); }

.btn-register {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #00b894 0%, #00a085 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-register:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,184,148,0.35);
}

.login-link {
    text-align: center;
    margin-top: 24px;
    color: #636e82;
    font-size: 0.9rem;
}

.login-link a {
    color: #00b894;
    text-decoration: none;
    font-weight: 600;
}

.login-link a:hover { text-decoration: underline; }

.password-hint {
    font-size: 0.78rem;
    color: #5a6a7a;
    margin-top: 6px;
    line-height: 1.4;
}
</style>

<div class="register-container">
    <div class="register-card">
        <div class="register-brand">
            <div class="icon"><i class="fas fa-user-plus"></i></div>
            <h1>Create <span>Account</span></h1>
        </div>
        <h2>Start practicing for your interviews</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                <p class="password-hint">Must be at least 8 characters with letters and numbers</p>
            </div>
            
            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
