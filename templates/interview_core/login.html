{% extends 'base.html' %}

{% block title %}Login - Interview Review{% endblock %}

{% block content %}
<style>
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
}

.login-card {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 24px;
    padding: 45px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    animation: scaleIn 0.4s ease-out;
}

@keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.login-brand {
    text-align: center;
    margin-bottom: 10px;
}
.login-brand .icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: white;
    margin-bottom: 12px;
    box-shadow: 0 8px 25px rgba(116,185,255,0.3);
}
.login-brand h1 {
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.3px;
}
.login-brand h1 span { color: #74b9ff; }

.login-card h2 {
    text-align: center;
    color: #8a9bb5;
    margin-bottom: 30px;
    font-size: 1rem;
    font-weight: 500;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    color: #8a9bb5;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.88rem;
    letter-spacing: 0.3px;
}

.form-group input {
    width: 100%;
    padding: 14px 18px;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    font-size: 15px;
    background: rgba(255,255,255,0.04);
    color: #e0e6ed;
    transition: all 0.3s ease;
    box-sizing: border-box;
    font-family: inherit;
}

.form-group input:focus {
    outline: none;
    border-color: #74b9ff;
    background: rgba(116,185,255,0.06);
    box-shadow: 0 0 0 4px rgba(116,185,255,0.1);
}

.form-group input::placeholder { color: rgba(224,230,237,0.35); }

.btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(116,185,255,0.35);
}

.register-link {
    text-align: center;
    margin-top: 24px;
    color: #636e82;
    font-size: 0.9rem;
}

.register-link a {
    color: #74b9ff;
    text-decoration: none;
    font-weight: 600;
}

.register-link a:hover { text-decoration: underline; }
</style>

<div class="login-container">
    <div class="login-card">
        <div class="login-brand">
            <div class="icon"><i class="fas fa-code"></i></div>
            <h1>Interview<span>Review</span></h1>
        </div>
        <h2>Sign in to your account</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="{% url 'register' %}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
